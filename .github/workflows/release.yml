name: signed-release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    environment: release
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '1.26.5', cache: true}
      - name: Verify protected tag ancestry and format
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(preview|rc)\.[0-9]+)?$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: go test ./...
      - run: go vet ./...
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: |
          set -euo pipefail
          mkdir dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*}; GOARCH=${target#*/}; ext=""; [ "$GOOS" = windows ] && ext=.exe
            for command in agent-comms agent-comms-daemon agent-comms-server agent-comms-verify; do
              name="${command}-${GOOS}-${GOARCH}${ext}"
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="-s -w -X github.com/DhanushSantosh/AgentComms/internal/app.Version=${GITHUB_REF_NAME#v} -X github.com/DhanushSantosh/AgentComms/internal/buildinfo.Version=${GITHUB_REF_NAME#v} -X github.com/DhanushSantosh/AgentComms/internal/buildinfo.BuildID=${GITHUB_SHA}" -o "dist/$name" "./cmd/$command"
            done
          done
          cd dist
          sha256sum agent-comms-* > checksums.txt
          for asset in agent-comms-*; do cosign sign-blob --yes --bundle "${asset}.bundle" "$asset"; done
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with: {path: dist, format: spdx-json, output-file: dist/sbom.spdx.json}
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with: {subject-path: 'dist/agent-comms-*'}
      - name: Build release title and notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found && /^### / { exit }
            found && /^\[/ { exit }
            found { print }
          ' CHANGELOG.md > dist/release-notes.md
          if [ ! -s dist/release-notes.md ]; then
            echo "::error::No CHANGELOG.md entry found for version $version -- add one before tagging a release, per docs/releasing.md."
            exit 1
          fi
          title="$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")"
          if [ -z "$title" ]; then
            echo "::error::Tag $GITHUB_REF_NAME has no annotation message to use as the release title. Create it with git tag -a, not git tag."
            exit 1
          fi
          echo "release_title=$title" >> "$GITHUB_OUTPUT"
          prev_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [ -n "$prev_tag" ]; then
            {
              echo ""
              echo "---"
              echo ""
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${GITHUB_REF_NAME}"
            } >> dist/release-notes.md
          fi
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ steps.notes.outputs.release_title }}
          body_path: dist/release-notes.md
          prerelease: ${{ contains(github.ref_name, 'preview') || contains(github.ref_name, 'rc') }}
          files: |
            dist/agent-comms-windows-amd64.exe*
            dist/agent-comms-windows-arm64.exe*
            dist/agent-comms-linux-amd64*
            dist/agent-comms-linux-arm64*
            dist/agent-comms-darwin-amd64*
            dist/agent-comms-darwin-arm64*
            dist/agent-comms-daemon-*
            dist/agent-comms-server-*
            dist/agent-comms-verify-*
            dist/checksums.txt
