name: private-release
on: {workflow_dispatch: {inputs: {tag: {description: Tag, required: true}}}}
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.x'}
      - shell: bash
        run: |
          mkdir dist
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*}; GOARCH=${target#*/}; ext=""; [ "$GOOS" = windows ] && ext=.exe
            GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="-s -w" -o "dist/agent-comms-${GOOS}-${GOARCH}${ext}" ./cmd/agent-comms
          done
          cd dist && sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@v2
        with: {tag_name: '${{ inputs.tag }}', files: 'dist/*', draft: true}
