name: signed-release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x', cache: true}
      - uses: sigstore/cosign-installer@v4.1.2
      - run: |
          set -euo pipefail
          mkdir dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*}; GOARCH=${target#*/}; ext=""; [ "$GOOS" = windows ] && ext=.exe
            name="agent-comms-${GOOS}-${GOARCH}${ext}"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="-s -w -X github.com/DhanushSantosh/AgentComms/internal/app.Version=${GITHUB_REF_NAME#v}" -o "dist/$name" ./cmd/agent-comms
          done
          cd dist
          sha256sum agent-comms-* > checksums.txt
          for asset in agent-comms-*; do cosign sign-blob --yes --bundle "${asset}.bundle" "$asset"; done
      - uses: anchore/sbom-action@v0
        with: {path: dist, format: spdx-json, output-file: dist/sbom.spdx.json}
      - uses: actions/attest-build-provenance@v3
        with: {subject-path: 'dist/agent-comms-*'}
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'preview') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: dist/*
