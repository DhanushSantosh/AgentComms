name: promotion

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true
      - name: Require dev promotion ancestry
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REF" != "dev" ] && [[ "$HEAD_REF" != hotfix/* ]]; then
            echo "::error::Promotion must originate from dev or a documented hotfix/* branch."
            exit 1
          fi
      - name: Require release documentation
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA..$HEAD_SHA" | grep -Eq '^(CHANGELOG.md|docs/releasing.md)$' || {
            echo "::error::Release promotion must update CHANGELOG.md or release documentation."
            exit 1
          }
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Reproducible cross-build smoke
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          mkdir dist-a dist-b
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            name="agent-comms-${os}-${arch}${ext}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -buildvcs=false -ldflags="-buildid=" -o "dist-a/$name" ./cmd/agent-comms
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -buildvcs=false -ldflags="-buildid=" -o "dist-b/$name" ./cmd/agent-comms
            cmp "dist-a/$name" "dist-b/$name"
          done
