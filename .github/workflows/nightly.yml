name: nightly

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deep-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
        if: runner.os != 'Windows'
      - run: go vet ./...

  # Unstable beta channel, distinct from signed-release: publishes a rolling
  # pre-release built straight from dev's latest commit, gated only on
  # deep-test passing -- no CHANGELOG requirement, no protected `release`
  # environment approval, since this is explicitly not a real numbered
  # version. Never the tag/asset-immutability rule docs/releasing.md sets
  # for actual semver releases: this channel is a rolling snapshot by design.
  beta-release:
    needs: deep-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with: {fetch-depth: 0}
      - name: Skip if dev hasn't moved since the last nightly build
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_sha="$(gh release view v0.0.0-nightly --json targetCommitish --jq .targetCommitish 2>/dev/null || true)"
          if [ "$previous_sha" = "$GITHUB_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.guard.outputs.skip == 'false'
        with: {go-version: '1.26.5', cache: true}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.guard.outputs.skip == 'false'
      - name: Build and sign nightly binaries
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*}; GOARCH=${target#*/}; ext=""; [ "$GOOS" = windows ] && ext=.exe
            for command in agent-comms agent-comms-daemon agent-comms-server; do
              name="${command}-${GOOS}-${GOARCH}${ext}"
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="-s -w -X github.com/DhanushSantosh/AgentComms/internal/app.Version=0.0.0-nightly -X github.com/DhanushSantosh/AgentComms/internal/buildinfo.Version=0.0.0-nightly -X github.com/DhanushSantosh/AgentComms/internal/buildinfo.BuildID=${GITHUB_SHA}" -o "dist/$name" "./cmd/$command"
            done
          done
          cd dist
          sha256sum agent-comms-* > checksums.txt
          for asset in agent-comms-*; do cosign sign-blob --yes --bundle "${asset}.bundle" "$asset"; done
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        if: steps.guard.outputs.skip == 'false'
        with: {path: dist, format: spdx-json, output-file: dist/sbom.spdx.json}
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        if: steps.guard.outputs.skip == 'false'
        with: {subject-path: 'dist/agent-comms-*'}
      - name: Replace the rolling nightly release
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v0.0.0-nightly --cleanup-tag --yes 2>/dev/null || true
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        if: steps.guard.outputs.skip == 'false'
        with:
          tag_name: v0.0.0-nightly
          target_commitish: ${{ github.sha }}
          name: "Nightly beta build (unstable)"
          prerelease: true
          body: |
            **Unstable nightly build from `dev` -- not a numbered release, not for production use.**

            Built from commit ${{ github.sha }} on ${{ github.event.repository.updated_at }}. This tag and its assets are replaced every night; it is not covered by the [release process](https://github.com/DhanushSantosh/AgentComms/blob/main/docs/releasing.md)'s tag/asset-immutability guarantee the way real `vX.Y.Z` releases are. Binaries are still Cosign-signed with full provenance attestation, independently verifiable the same way -- just not wired into `install.sh`/`install.ps1`, which install the latest real release.
          files: |
            dist/agent-comms-windows-amd64.exe*
            dist/agent-comms-windows-arm64.exe*
            dist/agent-comms-linux-amd64*
            dist/agent-comms-linux-arm64*
            dist/agent-comms-darwin-amd64*
            dist/agent-comms-darwin-arm64*
            dist/agent-comms-daemon-*
            dist/agent-comms-server-*
            dist/checksums.txt
