name: dco

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Verify DCO sign-offs
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0
          policy_start=$(git log --reverse --format=%H -- .github/workflows/dco.yml | head -n 1)
          while read -r commit; do
            [ -z "$commit" ] && continue
            if [ "$commit" != "$policy_start" ] && git merge-base --is-ancestor "$commit" "$policy_start"; then
              echo "Grandfathering pre-DCO commit $commit"
              continue
            fi
            if ! git show -s --format=%B "$commit" | grep -Eiq '^Signed-off-by: .+ <[^>]+>$'; then
              echo "::error::Commit $commit is missing a Signed-off-by trailer. Use git commit -s."
              failed=1
            fi
          done < <(git rev-list "${BASE_SHA}..${HEAD_SHA}")
          exit "$failed"
