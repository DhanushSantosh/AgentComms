name: deploy-sites
on:
  push:
    branches: [dev, main]
    paths: ['sites/**']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: deploy-sites-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        site: [landing, docs]
        include:
          - site: landing
            project_id: prj_jWXYbvtwJfukT0LsD0Neq4g6ioEN
          - site: docs
            project_id: prj_7BAQcgWuAqaLfUr54F8eiZq0yZeb
    env:
      VERCEL_ORG_ID: team_2cM7s1JXUBtYKXGzcArdtbeQ
      VERCEL_PROJECT_ID: ${{ matrix.project_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '1.26.5'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - name: Resolve this push's deploy channel
        id: channel
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "vercel_env=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
            echo "docs_url=https://agent-comms-docs.vercel.app" >> "$GITHUB_OUTPUT"
            echo "landing_url=https://agent-comms-landing.vercel.app" >> "$GITHUB_OUTPUT"
          else
            echo "vercel_env=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
            echo "docs_url=https://agent-comms-docs-beta.vercel.app" >> "$GITHUB_OUTPUT"
            echo "landing_url=https://agent-comms-landing-beta.vercel.app" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and deploy
        working-directory: sites/${{ matrix.site }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DOCS_SITE_URL: ${{ steps.channel.outputs.docs_url }}
          PUBLIC_MARKETING_SITE_URL: ${{ steps.channel.outputs.landing_url }}
          NEXT_PUBLIC_DOCS_URL: ${{ steps.channel.outputs.docs_url }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.channel.outputs.landing_url }}
        run: |
          set -euo pipefail
          npx vercel pull --yes --environment="${{ steps.channel.outputs.vercel_env }}" --token="$VERCEL_TOKEN"
          npx vercel build ${{ steps.channel.outputs.prod_flag }} --token="$VERCEL_TOKEN"
          url=$(npx vercel deploy --prebuilt ${{ steps.channel.outputs.prod_flag }} --token="$VERCEL_TOKEN")
          echo "Deployed $GITHUB_REF_NAME/${{ matrix.site }} -> $url"
          if [ "${{ github.ref_name }}" != "main" ]; then
            alias="agent-comms-${{ matrix.site }}-beta.vercel.app"
            npx vercel alias set "$url" "$alias" --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
            echo "Aliased beta -> https://$alias"
          fi
