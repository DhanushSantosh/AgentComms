version: "3"

tasks:
  format:
    desc: Format Go source
    cmds: ["go fmt ./..."]
  test:
    desc: Run the portable test suite
    cmds: ["go test ./..."]
  vet:
    desc: Run Go vet
    cmds: ["go vet ./..."]
  race:
    desc: Run race tests where the local Go toolchain supports CGO
    cmds: ["go test -race ./..."]
  check:
    desc: Run the core contributor checks
    deps: [test, vet]
  build:
    desc: Build the local CLI
    cmds:
      - |
        VERSION=$$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
        if [ -z "$$VERSION" ]; then VERSION="dev"; fi
        BUILD=$$(git rev-parse --short HEAD 2>/dev/null || echo "dev")
        go build -trimpath -ldflags="-s -w \
          -X github.com/DhanushSantosh/AgentComms/internal/app.Version=$$VERSION \
          -X github.com/DhanushSantosh/AgentComms/internal/buildinfo.Version=$$VERSION \
          -X github.com/DhanushSantosh/AgentComms/internal/buildinfo.BuildID=$$BUILD" \
          -o agent-comms ./cmd/agent-comms
  install:
    desc: Build and install the CLI to ~/.local/bin
    cmds:
      - |
        VERSION=$$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
        if [ -z "$$VERSION" ]; then VERSION="dev"; fi
        BUILD=$$(git rev-parse --short HEAD 2>/dev/null || echo "dev")
        go build -trimpath -ldflags="-s -w \
          -X github.com/DhanushSantosh/AgentComms/internal/app.Version=$$VERSION \
          -X github.com/DhanushSantosh/AgentComms/internal/buildinfo.Version=$$VERSION \
          -X github.com/DhanushSantosh/AgentComms/internal/buildinfo.BuildID=$$BUILD" \
          -o ~/.local/bin/agent-comms ./cmd/agent-comms
        ln -sf agent-comms ~/.local/bin/agc
